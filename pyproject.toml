[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "signal-lm"
version = "0.1.0"
description = "Compact signal model initialized from scratch, with deterministic measurements"
requires-python = ">=3.11"
dependencies = ["numpy>=1.26,<3", "torch>=2.6,<3"]

[project.optional-dependencies]
dev = ["pytest>=8,<10"]

[project.scripts]
signal-lm = "signal_lm.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
signal_lm = ["static/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
